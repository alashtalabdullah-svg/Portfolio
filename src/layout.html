<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="UTF-8">
<!-- Inline and first, so it runs before the first paint. The boot screen
     is a one-time event for the visit, not for the document: on a four-page
     site, replaying it on every navigation turned each click into a wait
     for the web fonts to arrive again. The flag is read here, ahead of any
     paint, so a returning page never flashes the overlay at all. -->
<script>var d=document.documentElement;d.classList.add("js");try{if(sessionStorage.getItem("ashtal-booted")==="1")d.classList.add("pre-booted")}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="author" content="{{author}}">

<!-- max-image-preview:large is what lets Google use the full-width
     thumbnail in a result; max-snippet:-1 lifts the snippet length cap.
     Both are opt-in — the defaults are more conservative. -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1">

<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="ar" href="{{altAr}}">
<link rel="alternate" hreflang="en" href="{{altEn}}">
<link rel="alternate" hreflang="x-default" href="{{xdefault}}">

<meta name="theme-color" content="#EFEBE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/assets/site.webmanifest">

<meta property="og:type" content="profile">
<meta property="og:locale" content="{{locale}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{ogDesc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="{{author}}">
<meta property="og:image" content="{{ogImageAbs}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{author}} — {{role}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{ogDesc}}">
<meta name="twitter:image" content="{{ogImageAbs}}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The font CSS is a render-blocking request on a third-party host, which
     is the longest pole in first paint here. Fetching it as a non-blocking
     preload and promoting it to a stylesheet on load takes it off the
     critical path; the <noscript> keeps it working without JS. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="/assets/css/system.css">
{{{preload}}}

<!-- Both are enhancements loaded with `defer`, and both are checked for
     before use. If either CDN is unreachable the page keeps its whole
     motion system: system.js is hand-written and depends on nothing. -->
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>

{{{jsonld}}}

<!-- Speculation rules: the browser fetches and renders the next page while
     the pointer is still on its way to the link, so the navigation lands
     with the work already done. Four small pages make this cheap, and it
     is the largest single win available on LCP for a click-through.
     `moderate` means on hover, not on sight — no bandwidth is spent on
     links the reader never approaches. Unsupported browsers ignore it. -->
<script type="speculationrules">
{
  "prerender": [{
    "where": { "and": [
      { "href_matches": "/*" },
      { "not": { "href_matches": "/assets/*" } }
    ]},
    "eagerness": "moderate"
  }]
}
</script>
</head>
<body class="p-{{pageId}}" data-page="{{pageIndex}}" data-pages="{{pageCount}}">

{{> sprite}}

<!-- ambient layers — all read from --order -->
<div class="grain" aria-hidden="true"></div>
<canvas class="plot" aria-hidden="true"></canvas>
<div class="reticle" aria-hidden="true"><b></b><i></i></div>

<a class="skip" href="#main">{{ui.skip}}</a>

<div class="boot" aria-hidden="true">
  <div class="boot__inner">
    <span class="boot__label mono">{{ui.boot}}</span>
    <span class="boot__bar"><i></i></span>
    <span class="boot__pct mono">00{{pc}}</span>
  </div>
</div>

{{> bar}}
{{> idx}}

<aside class="meter" aria-label="{{ui.meter}}" aria-live="off">
  <span class="meter__lbl mono">{{ui.meter}}</span>
  <span class="meter__bar" aria-hidden="true"><i></i></span>
  <span class="meter__val mono" data-order-pct>00{{pc}}</span>
  <span class="meter__now mono" data-order-now>{{n}} · {{navLabel}}</span>
</aside>

<main id="main">
{{{crumbs}}}
{{{body}}}
</main>

{{> foot}}

<script src="/assets/js/system.js" defer></script>
<script src="/assets/js/field.js" defer></script>
<script src="/assets/js/motion.js" defer></script>
</body>
</html>
